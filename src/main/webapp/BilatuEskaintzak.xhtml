<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"
	xmlns:f="jakarta.faces.core" xmlns:p="http://primefaces.org/ui" xmlns:ui="jakarta.faces.facelets">
<f:view>
	<h:head>
		<title>Ikusi eskaintzak</title>
		<h:outputStylesheet library="css" name="style.css" />
	</h:head>
	<h:body>
		<h:form styleClass="bilatu-form">
			<h3>Eskaintzak bilatu (Hutsik utzi eskaintza guztiak bilatzeko)</h3>
			<div class="eremua">
				<p:inputText id="bilatzailea" value="#{bilatu.tituloa}"/>
				<p:commandButton id="bilatu-botoia" value="Bilatu" action="#{bilatu.bilatu}" update="aurkitutakoa"/>
				<p:button id="atzera-botoia" value="Atzera joan" action="#{bilatu.atzeraEgin()}"/>
			</div>
			
			<div class="eremua">
				<h:panelGroup id="aurkitutakoa" layout="block">
					<p:dataTable id="taula" var="eskaintza" value="#{bilatu.eskaintzak}" rendered="#{bilatu.bilatua}" emptyMessage="Ez da eskaintzarik aurkitu"
								 selectionMode="single" selection="#{bilatu.aukeratutakoEskaintza}" rowKey="#{eskaintza.saleNumber}" >
						<p:ajax event="rowDblselect" listener="#{bilatu.bistaratuEskaintza}"/>
						<f:facet name="header"> 
							<h:outputText value="Eskaintzak (Klik bikoitza eskaintza ikusteko)" rendered="#{not empty bilatu.eskaintzak}"/>
						</f:facet>
						
						<p:column headerText="Tituloa" style="text-align: left;">
							<h:outputText value="#{eskaintza.title}"/>
						</p:column>
						
						<p:column headerText="Prezioa" style="text-align: center;">
							<h:outputText value="#{eskaintza.price}"/>
						</p:column>
						
						<p:column headerText="Argitarapen eguna" style="text-align: center;">
							<h:outputText value="#{eskaintza.publicationDate}">
								<f:convertDateTime pattern="yyyy/MM/dd HH:mm" timeZone="Europe/Madrid" />
							</h:outputText>
						</p:column>
						
						<f:facet name="footer"> 
							<h:outputText value="Guztira #{bilatu.eskaintzaKop} aurkitu dira" rendered="#{not empty bilatu.eskaintzak}"/> 
						</f:facet>
					</p:dataTable>
				</h:panelGroup>
			</div>
		</h:form>
	</h:body>
</f:view>
</html>
